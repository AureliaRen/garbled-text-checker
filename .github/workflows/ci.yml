name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Windows 控制台默认 GBK：确保测试环境 UTF-8，验证脚本自修复逻辑
      - name: Set UTF-8 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "PYTHONIOENCODING=utf-8" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          python tests/test_garbled.py
          python tests/test_hook.py
          python tests/test_cli.py
          python tests/test_latex.py

      # shell: python + tempfile：/tmp 是 POSIX 路径，Windows runner 上不存在
      - name: Verify CLI demo (smoke)
        shell: python
        run: |
          import json, os, subprocess, sys, tempfile
          out = os.path.join(tempfile.gettempdir(), "demo.json")
          with open(out, "w", encoding="utf-8") as f:
              subprocess.run([sys.executable, "scripts/garbled_fix.py", "--demo", "--json"],
                             stdout=f, check=True)
          with open(out, encoding="utf-8") as f:
              d = json.load(f)
          assert len(d) == 12, d
          print("demo OK:", len(d), "types")

      - name: Verify --check exit code
        shell: python
        run: |
          import os, subprocess, sys, tempfile
          tmp = tempfile.gettempdir()
          bad_p = os.path.join(tmp, "bad.txt")
          good_p = os.path.join(tmp, "good.txt")
          bad = '好好学习天天向上'.encode('utf-8').decode('latin-1')
          with open(bad_p, "w", encoding="utf-8") as f:
              f.write(bad)
          with open(good_p, "w", encoding="utf-8") as f:
              f.write("正常文本")
          for f, want in ((bad_p, 1), (good_p, 0)):
              r = subprocess.run([sys.executable, "scripts/garbled_fix.py", "--check", "-f", f])
              assert r.returncode == want, (f, r.returncode)
          print("--check exit codes OK")
